apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    resources.gardener.cloud/ignore: "true"
    argocd.argoproj.io/sync-wave: "-99"
  name: coredns-custom
  namespace: kube-system
data:
  # Dedicated server block per zone — the default Corefile (k3s, Gardener)
  # already uses the hosts plugin in its main block, so a hosts entry in
  # *.override would crash CoreDNS ("plugin can only be used once per block").
  custom-hosts.server: |
    example.com:53 {
        errors
        cache 30
        hosts {
            10.0.11.14 git.example.com
        }
    }
    examplecloud.com:53 {
        errors
        cache 30
        hosts {
            198.51.100.101 api.ap3kfy18.prd.m.fke.examplecloud.com
            198.51.100.193 api.sa5r4eco.prd.m.fke.examplecloud.com
        }
    }

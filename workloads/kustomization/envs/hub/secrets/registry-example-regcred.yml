apiVersion: v1
kind: Secret
metadata:
  name: registry-example-regcred
  namespace: kube-system
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "" # all namespaces
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "" # all namespaces
type: kubernetes.io/dockerconfigjson
stringData:
  # NOTE: example only — do not commit real registry credentials.
  # Prefer managing this secret via ExternalSecret (Vault) instead.
  .dockerconfigjson: |
    {"auths":{"registry.example.com":{"username":"<registry-username>","password":"<registry-password>","auth":"<base64(username:password)>"}}}

# Workload/application project — narrower than the *-infra projects:
# only Namespace is allowed at cluster scope (needed by CreateNamespace=true).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production-apps
  namespace: argocd
spec:
  description: Production business applications project
  sourceRepos:
    - 'https://github.com/nh4ttruong/argocd-gitops-spokes.git'
  destinations:
    - namespace: '*'
      server: 'https://k3d-production-server-0:6443' # production cluster (k3d demo — replace with the real API server)
  clusterResourceWhitelist:
    - group: ''
      kind: 'Namespace'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

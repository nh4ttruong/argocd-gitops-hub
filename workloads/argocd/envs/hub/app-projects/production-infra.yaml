# NOTE (demo configuration): resource whitelists are intentionally wide open
# to keep the demo friction-free. Before real production use, tighten them.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: production-infra
  namespace: argocd
spec:
  description: Production infrastructure project
  sourceRepos:
    - 'https://github.com/nh4ttruong/argocd-gitops-hub.git'
  destinations:
    - namespace: '*'
      server: '<PROD_CLUSTER_API_SERVER>' # prod cluster
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

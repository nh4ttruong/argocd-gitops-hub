# NOTE (demo configuration): resource whitelists are intentionally wide open
# to keep the demo friction-free. Before real production use, tighten them.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-infra
  namespace: argocd
spec:
  description: Dev infrastructure project
  sourceRepos:
    - 'https://github.com/nh4ttruong/argocd-gitops-hub.git'
  destinations:
    - namespace: '*'
      server: 'https://k3d-dev-server-0:6443' # dev cluster (k3d demo — replace with the real API server)
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Infrastructure — one project per environment, owned by the platform team.
  # Name must match the ApplicationSet template: {env}-infra
  - hub-infra.yaml
  - dev-infra.yaml
  - staging-infra.yaml
  - production-infra.yaml
  # Applications — one project per environment for spoke workloads.
  # Name must match the ApplicationSet template: {env}-apps
  - dev-apps.yaml
  - staging-apps.yaml
  - production-apps.yaml

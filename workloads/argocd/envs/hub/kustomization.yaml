apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.3.3
    releaseName: argocd
    includeCRDs: true
    namespace: argocd
    valuesFile: argo-cd-values.yaml

resources:
  - ../../base
  - app-projects/
  - in-cluster-registration.yaml
